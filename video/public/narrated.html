<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方立 · 短视频制作</title>
  <link rel="stylesheet" href="/video/video-ui.css">
  <link rel="stylesheet" href="/video/narrated.css">
  <script src="/video/narrated.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#short-editor">跳到短视频编辑</a>
  <header class="topbar short-top"><a class="brand" href="/">方立</a><h1>短视频制作</h1><nav aria-label="工作区"><a href="/video/">全文视频</a><a href="/workbench/index.html">文案工作台</a></nav></header>
  <div id="short-status" class="short-status" role="status" aria-live="polite"></div>
  <div class="short-workspace">
    <aside class="rail short-rail" aria-label="客户和短视频">
      <label for="short-client">客户</label>
      <select id="short-client"><option value="">选择客户</option></select>
      <section class="short-materials" aria-labelledby="short-materials-title">
        <h2 id="short-materials-title">素材库</h2>
        <div class="short-drop" id="short-drop">
          <label for="short-upload">上传图片或视频</label>
          <input id="short-upload" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm,video/x-matroska,.mkv,.mov" multiple disabled>
          <p class="muted">可多选，也可拖到这里</p>
        </div>
        <p class="muted" id="short-library-note">选择客户后查看素材。</p>
        <div class="short-library" id="short-library" aria-label="当前客户素材"></div>
        <figure class="short-media-preview" id="short-media-preview" hidden>
          <img id="short-media-image" alt="素材预览" hidden>
          <figcaption id="short-media-name"></figcaption>
        </figure>
      </section>
      <div class="section-head"><h2>我的短视频</h2><button id="short-new" class="text-button" type="button" disabled>新建</button></div>
      <nav id="short-history" aria-label="短视频草稿"></nav>
    </aside>
    <main id="short-editor" tabindex="-1">
      <form id="short-source" class="short-source">
        <p class="short-kicker">9:16 · 30—45 秒</p>
        <h2>这条视频想讲什么？</h2>
        <div id="short-source-name" class="short-origin">客户资料</div>
        <label for="short-topic">视频主题</label>
        <textarea id="short-topic" rows="2" maxlength="500" placeholder="例如：长毛猫到店洗护前要准备哪三件事？"></textarea>
        <label for="short-template" class="short-template-label">页面模板</label>
        <select id="short-template"><option value="process">流程说明</option></select>
        <details id="short-documents" hidden><summary>本次使用的资料</summary><div id="short-document-list"></div></details>
        <button type="submit" id="short-generate" class="primary" disabled>生成短脚本</button>
      </form>
      <section id="short-draft" hidden>
        <div class="section-head short-draft-head"><div><p class="short-kicker" id="short-origin-label"></p><h2>口播与画面</h2></div><span id="short-revision"></span></div>
        <label for="short-title">视频标题</label><input id="short-title" maxlength="40">
        <label for="short-draft-template" class="short-template-label">默认页面模板</label>
        <select id="short-draft-template"><option value="process">流程说明</option></select>
        <p class="muted short-count" id="short-character-count" aria-live="polite"></p>
        <div id="short-pages"></div>
        <div class="short-publishing">
          <h3>发布信息</h3>
          <label for="short-publish-title">发布标题</label><input id="short-publish-title" maxlength="80">
          <label for="short-publish-description">发布简介</label><textarea id="short-publish-description" rows="3" maxlength="300"></textarea>
        </div>
        <details class="short-edit-record"><summary>来源与编辑记录</summary><div id="short-editorial"></div></details>
        <div class="short-action-bar">
          <div><label class="check-row"><input type="checkbox" id="short-narration" checked><span>普通话配音</span></label><p class="muted" id="short-voice"></p></div>
          <div class="actions"><button class="text-button" type="button" id="short-revert" disabled>撤销修改</button><button class="secondary" type="button" id="short-save" disabled>保存新版本</button><button class="primary" type="button" id="short-render" disabled>制作成片</button></div>
        </div>
      </section>
    </main>
    <aside class="short-preview" aria-label="页面和成片预览" id="short-preview" hidden>
      <div class="section-head"><h2>预览</h2><span>720 × 1280</span></div>
      <div id="short-preview-tabs" class="short-preview-tabs" aria-label="选择预览页面"></div>
      <figure class="short-phone"><img id="short-preview-image" alt="短视频页面预览"><video id="short-player" controls playsinline preload="metadata" hidden></video></figure>
      <p id="short-preview-label" class="muted"></p>
      <section id="short-release" class="short-release" aria-label="发布信息" hidden></section>
      <div class="short-downloads" id="short-downloads"></div>
      <section class="short-renders" id="short-renders"></section>
    </aside>
  </div>
</body>
</html>
